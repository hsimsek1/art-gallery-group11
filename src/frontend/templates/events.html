{% extends 'base.html' %}
{% block title %}Record movement{% endblock %}
{% block content %}
<h1>Record a gallery movement</h1>
<p>Employees and administrators only. Room is required only for room movements. Invalid moves are rejected with 409.</p>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Person <select name="person_id" required>
    {% for person in people %}<option value="{{ person.id }}">{{ person.name }}</option>{% endfor %}
  </select></label>
  <label>Movement <select name="event_type" required>
    <option value="gallery_enter">Enter gallery</option>
    <option value="room_enter">Enter room</option>
    <option value="room_leave">Leave room</option>
    <option value="gallery_leave">Leave gallery</option>
  </select></label>
  <label>Room (choose only for room entry/exit) <select name="room_id">
    <option value="">Not applicable</option>
    {% for room in rooms %}<option value="{{ room.id }}">{{ room.name }}</option>{% endfor %}
  </select></label>
  <button type="submit">Record event</button>
</form>
{% endblock %}
